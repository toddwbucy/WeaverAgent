[package]
name = "weaver-trace"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The recorder: canonical NDJSON rendering, the working structure, and the stream writer"

# The dependency set is two crates and no internal one, per weaver-trace-Spec
# section 1: serde with derive, and serde_json with raw_value for splicing the
# harness's pre-rendered payloads without re-encoding them. The feature is named
# here rather than discovered at build time. No weaver-* dependency at all - the
# manifest test reads the resolved tree and this comment is not the instrument.
[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
