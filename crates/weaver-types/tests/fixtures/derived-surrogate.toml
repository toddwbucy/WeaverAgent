binding-kind = "diagnostic"
permission-mode = "ask"
session = "s-diagnostic"
tool-set = []

[spu-instruction.decoder]
residual-readout-election = false
surprisal-election = false
identity-file = "system-prompt.md"

[spu-instruction.decoder.model-binding]
artifact = "/opt/weaver/models/qwen2.5-0.5b-instruct-q8_0.gguf"
devices = [0]

[spu-instruction.decoder.tunable-values]
context-capacity = 16384
max-tokens-per-turn = 1024
seed = 451234785645

[trace-sink]
create = true
kind = "file"
path = "/tmp/diag.ndjson"
