[package]
name = "weaver-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The floor's data definitions: the agent config, the identity pair, and the loop 0 wire vocabulary"

# The dependency set is four crates, one of them optional, per weaver-types-Spec
# section 1: weaver-traits as the one floor-link, serde for the config and wire
# types both, serde_json for the wire encoding, and a TOML implementation behind
# the non-default config feature, per the Spec's section 2 election. toml is
# Cargo's own format crate, safe Rust, confirmed maintained at the moment of
# writing this manifest, per the Spec's section 6. Its default features are off
# and only parse and serde are taken: the crate reads a declaration and never
# writes one.
[dependencies]
weaver-traits = { path = "../weaver-traits" }
serde.workspace = true
# raw_value gates the splicing type section 4.4's measurement crosses as, per
# weaver-types-Spec section 1: pre-serialized JSON written in place, never a
# quoted string.
serde_json = { workspace = true, features = ["raw_value"] }
toml = { version = "1.1", optional = true, default-features = false, features = ["std", "parse", "serde"] }

[features]
config = ["dep:toml"]

[dev-dependencies]
