[package]
name = "weaver-admin"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The supervisor: the operator surface, the lifecycle verbs, custody of the sink, and the coordination channel"

# One binary and no library surface, per weaver-admin-Spec section 1: nothing
# links admin, so a lib target would be an API for a consumer the topology
# forbids.
[[bin]]
name = "weaver-admin"
path = "src/main.rs"

# The internal set is one floor link, weaver-types WITH its `config` feature,
# because admin is the crate that parses the operator's file. weaver-traits is
# deliberately not a direct line: it arrives transitively and nothing here
# draws it by name. serde_json encodes the surface's lines and the channel's
# envelopes. nix is the OS surface, on the grounds weaver-harness-Spec section
# 2.4 argued and this crate inherits rather than re-argues. No async runtime,
# no bus crate, no logging crate - the manifest test reads the resolved tree.
[dependencies]
weaver-types = { path = "../weaver-types", features = ["config"] }
serde_json.workspace = true
nix = { version = "0.31", features = ["socket", "fs", "process", "uio", "user"] }
# The declaration's digest, supplied on the enter per weaver-admin-Spec section 1
# as of 2026-09-04, so the run and the record name what they were built from.
sha2 = "0.10"

[dev-dependencies]
weaver-types = { path = "../weaver-types", features = ["config"] }
