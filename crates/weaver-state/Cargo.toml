[package]
name = "weaver-state"
version = "0.1.0"
edition = "2024"

# The custodian, per weaver-state-Spec section 1: one binary, weaver-types
# as the floor link weaver-state-PRD section 1 declares and the operator's ruling of
# 2026-09-14 keeps, no unit here consuming it yet and what it will be drawn
# for that charter's cell, weaver-traits as the second floor link, drawn for
# the message model the typed landing decodes, and the externals the Spec
# names, the embedded engine's driver behind its feature (the service
# engine, postgres, retired on the operator's ruling of 2026-10-02 on #1). No async runtime of the crate's own,
# no logging crate, no HTTP, per the corpus's standing refusals.
[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
weaver-types = { path = "../weaver-types" }
weaver-traits = { path = "../weaver-traits" }
# `serialize` is the engine's serialization interface, which carries the
# save point, per `weaver-state-Spec` sections 1 and 3.
rusqlite = { version = "0.37", features = ["bundled", "serialize"], optional = true }
# `float_roundtrip` makes serde_json's float parse correctly rounded, so a
# reading the SPU rendered parses to the value it rendered and the typed
# landing of weaver-state-Spec section 3 can hold it typed. Without it the
# fast parse misrounds, the rendered value differs, and the landing's
# exactness rule sends the reading to `field` verbatim.
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
nix = { version = "0.31", features = ["socket", "fs", "uio", "user", "poll"] }
# The save point's check and digest, sha256 over its bytes, per
# `weaver-state-Spec` section 3 under section 6's election.
sha2 = "0.10"

# Test scaffolding only, per the operator ruling of 2026-09-22: wire
# round trips and live comparisons use the tee; production imports none.
[dev-dependencies]
weaver-trace = { path = "../weaver-trace" }
